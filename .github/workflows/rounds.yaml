name: Build (macOS and Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--bundles app'
          - platform: windows-latest
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install

      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm tauri build ${{ matrix.args }}

      # Not notarized: ad-hoc signed, so macOS asks once (right-click > Open)
      - name: Package the macOS app
        if: runner.os == 'macOS'
        run: |
          cd src-tauri/target/release/bundle/macos
          codesign --force --deep -s - Gale.app
          ditto -c -k --keepParent Gale.app Gale-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Gale-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/macos/Gale-macOS.zip
            src-tauri/target/release/bundle/nsis/*.exe
