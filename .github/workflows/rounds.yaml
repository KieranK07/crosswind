name: Build (macOS and Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--bundles app'
          - platform: windows-latest
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pnpm tauri build ${{ matrix.args }}

      # The ROUNDS layer on a real Thunderstore profile, on this OS
      - name: Test the ROUNDS layer
        shell: bash
        run: |
          python scripts/rounds-test-profile.py "$RUNNER_TEMP/rounds/profile"
          export ROUNDS_TEST_PROFILE="$RUNNER_TEMP/rounds/profile"
          cd src-tauri
          cargo test --release --lib rounds::tests::updates_a_thunderstore_profile -- --ignored --exact --nocapture
          cargo test --release --lib rounds::tests::packages_win -- --ignored --exact --nocapture

      # Not notarized: ad-hoc signed, so macOS asks once (Privacy & Security > Open Anyway)
      - name: Package the macOS app
        if: runner.os == 'macOS'
        run: |
          cd src-tauri/target/release/bundle/macos
          codesign --force --deep -s - Gale.app
          ditto -c -k --keepParent Gale.app Gale-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Gale-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/macos/Gale-macOS.zip
            src-tauri/target/release/bundle/nsis/*.exe
