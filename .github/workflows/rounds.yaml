name: Build (macOS and Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal: runs on Apple Silicon and Intel Macs
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            bundle: 'src-tauri/target/universal-apple-darwin/release/bundle'
          - platform: windows-latest
            args: '--bundles nsis'
            bundle: 'src-tauri/target/release/bundle'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - run: pnpm tauri build ${{ matrix.args }}

      # Not notarized: ad-hoc signed, so macOS asks once (Privacy & Security > Open Anyway)
      - name: Package the macOS app
        if: runner.os == 'macOS'
        run: |
          cd ${{ matrix.bundle }}/macos
          archs=$(lipo -archs Crosswind.app/Contents/MacOS/*) && [[ $archs == *x86_64* && $archs == *arm64* ]]
          codesign --force --deep -s - Crosswind.app
          ditto -c -k --keepParent Crosswind.app Crosswind-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Crosswind-${{ runner.os }}
          path: |
            ${{ matrix.bundle }}/macos/Crosswind-macOS.zip
            ${{ matrix.bundle }}/nsis/*.exe
