name: Build (macOS)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install

      # Universal: runs on Apple Silicon and Intel Macs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

      - run: pnpm tauri build --target universal-apple-darwin --bundles app

      # Not notarized: ad-hoc signed, so macOS asks once (Privacy & Security > Open Anyway)
      - name: Package the app
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          archs=$(lipo -archs Crosswind.app/Contents/MacOS/*) && [[ $archs == *x86_64* && $archs == *arm64* ]]
          codesign --force --deep -s - Crosswind.app
          ditto -c -k --keepParent Crosswind.app Crosswind-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Crosswind-macOS
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/Crosswind-macOS.zip
